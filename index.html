<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background:#f2f5f9; margin:0; padding:20px; }
    
    /* Ajustar el contenedor para que no deje espacio excesivo */
    .card { max-width: 600px; margin: 40px auto; background: #fff; padding: 24px;
            border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); text-align: center; }
            
    /* Acercar la imagen y el formulario usando flex con menor separación (gap: 15px) */
    .card-layout { display: flex; align-items: center; gap: 15px; flex-wrap: nowrap; justify-content: center; }
    .image-container { flex: 0 0 140px; text-align: center; }
    .image-container img { width: 100%; max-width: 130px; height: auto; display: block; margin: 0 auto; }
    .form-container { flex: 1; text-align: left; }

    /* Aplicar color institucional ESPOL (#0e3569) a los textos y títulos */
    h2 { margin-top: 0; color: #0e3569; font-size: 22px; text-align: center; }
    
    /* Aplicar colores institucionales a los botones y bordes activos */
    button { width: 100%; padding: 12px; margin-top: 15px; background: #0e3569; color: #fff;
             border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #3d8bba;
            border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; }
    input:focus { border-color: #0e3569; }

    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #c0392b; margin-top: 10px; min-height: 20px; text-align: center; }
    .turno { font-size: 64px; font-weight: bold; color: #1a3c6e; margin: 10px 0; }
    #resultado { display: none; }
    #espera { display: none; padding: 30px 10px; color: #1a3c6e; font-size: 20px; }
    #mensajeEspera { margin-top: 20px; font-size: 20px; color: #1a3c6e; }
    a { color: #1a3c6e; font-weight: bold; word-break: break-all; }
    
    /* Estilos de la encuesta dentro de la tarjeta centrada */
    #encuesta, #gracias { display: none; text-align: left; }
    .pregunta-item { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    .pregunta-titulo { font-size: 14px; color: #1a3c6e; font-weight: bold; margin-bottom: 8px; text-align: center; }
    
    /* Estilo del logotipo institucional de Admisiones */
    .image-container { flex: 0 0 140px; text-align: center; }
    .image-container img { width: 100%; max-width: 130px; height: auto; display: block; margin: 0 auto; }

    /* Estilos para las tortugas de la encuesta (escala de grises al estar inactivas, verde original al activarse) */
    .tortugas-container { display: flex; justify-content: center; align-items: flex-start; gap: 4px; margin: 10px 0; }
    .tortuga-wrap { cursor: pointer; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; width: 64px; }
    .tortuga-txt { margin-top: 4px; font-size: 10px; line-height: 1.2; color: #888; text-align: center; }
    .tortuga-txt b { display: block; font-size: 12px; color: #555; }
    .tortuga-wrap.activa .tortuga-txt, .tortuga-wrap.activa .tortuga-txt b { color: #1a3c6e; }
    
    .tortuga-img { 
        width: 38px; 
        height: 38px; 
        object-fit: contain;
        filter: grayscale(100%) opacity(0.4); 
        transition: filter 0.2s, transform 0.1s; 
    }
    
    .tortuga-wrap:hover .tortuga-img { 
        transform: scale(1.1); 
    }
    
    .tortuga-wrap.activa .tortuga-img { 
        filter: grayscale(0%) opacity(1); 
    }

    #gracias { font-size: 22px; color: #1a3c6e; padding: 20px 0; text-align: center; }

        
    .card.ancha { max-width: 1000px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: stretch; }
    .card.ancha #resultado { flex: 1 1 100%; }
    .card.ancha.con-encuesta #resultado { flex: 1 1 420px; }
    .card.ancha.con-encuesta .info-box { display: none; }
    .card.ancha.con-encuesta #encuesta { flex: 1 1 280px; align-self: center; }
    .espera-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; justify-content: center; }
    .video-box { flex: 1 1 420px; min-height: 360px; background: #000; border-radius: 10px; overflow: hidden; }
    .video-box iframe { width: 100%; height: 100%; min-height: 360px; border: 0; display: block; }
    .info-box { flex: 1 1 280px; display: flex; flex-direction: column; justify-content: center; }

  </style>
</head>

          <span class="tortuga-wrap" data-v="5"><img class="tortuga-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAApCAYAAABz26rUAAAACXBIWXMAAAsSAAALEgHS3X78AAAC8ElEQVRYhdWZwXHbMBBFnzW+S6nAcgVOB2DOPEQpgGOmgqgDMRVYHUQeFhDlwLPJCmxVELkDqwLngJUGogkSAGnJeSeLAMG/2MViAV+8vr7ykVFF8hmYAE9VnL/U20enl+SOKpIUeAQegFIVyaTe5/LUomyI2AiYmo+Nv2+AJZCa753dAAmRNXDl0H1Wf3DWEFJFEgElbuIBxvLOgbMZIPG8Bsaer0bmj3N6IMVfPMBCFclq/+OcBryJZw9uVZHM4YOn0Q4yVSST/9mAMTALSqOqSKbAHL2gboymDTqrrKo4f+oYZs1xng9hcuFTSojwDLh16L4BllWcr1rG+uv88WaunQ2QnXKJf+bYAVkV58uGMZfAD8/x9lRVnEdOa0DS1i/C0t4YuFNFspVd1yRDeyqEF3DIQiLeJWS6uAIexZMASHWZor3kQyXv0RpCqkgyYOE5uAvfzbUhninp9vAOva6y/QOrAVJzPPTT2cqXKs5L43tdRmyAqH4maAuhVT99nawlEwEgaXdu6bujQTxYDJA4da0QQxlTmyRbygXKJvFg90AWqsoTJeusC+um+MYAicX3nn2TxT4z1Wt9F5o8kPbTE8RSFUmJLi+8aKqFor5qAhjTXhdZQ+hggCqSGfB7QFFDsUOn10YupR6Zcnwb8JHY2jIQaA9Mga8nk+PPTVvjCJ0yfWuRU9KqbSQ7YER4Vfie7LDvzkCtFpI9ICW8Rh+Se2DeFv9gKeZ6HjSG4lOXeLCXEtNhtXhTuYgHuwHRcFqCUK5lRVMtNCPs6Dg0rYt3T5MHnF48AU5705EBMvt972oGwyWMDgbI6WjV85sbdPr7CXyj/96SdnU4pFG5LL3r8bFdFedH/wKSErmvR6+rON/aGs0Q6roK7MK7lh+CgwFyQ3CNDoEQsgH0mDyjby62bZ1sO/EUfX8/A/bXHWtgi94jJvIcaSvNKxJjnJAzxh9g3XLAP8LrcjcEMSJFGz1Bl8fP6Ml4Qk/ACxyiwIt/YYj5nvqEBvkAAAAASUVORK5CYII=" alt="Tortuga 5"></span>

      <button id="btnEncuesta" onclick="enviarEncuesta()" disabled>Enviar</button>
      <div class="error" id="errorEncuesta"></div>
    </div>

    <div id="gracias">¡Gracias por su opinión!</div>
  </div> 

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbyN2X_ET1ZAPZoFSUfiCaxiuxZoIX15YucfVWhIi3RI4Y1uBcolr4szeCabjUqFjh6_/exec';

    function llamar(accion, datos) {
      const q = new URLSearchParams(Object.assign({ accion: accion, t: Date.now() }, datos)).toString();
      return fetch(API + '?' + q, { cache: 'no-store' }).then(function (r) { return r.json(); });
    }
    let miFecha = null, miTurno = null, temporizador = null;
    const PREGUNTAS = [
      { texto: '1. ¿Qué tan fácil le resultó ingresar a la Ventanilla Virtual?',
        etiquetas: ['Muy difícil', 'Difícil', 'Ni fácil ni difícil', 'Fácil', 'Muy fácil'] },
      { texto: '2. ¿Qué tan adecuado fue el tiempo de espera desde que solicitó la atención hasta que fue atendido?',
        etiquetas: ['Muy inadecuado', 'Inadecuado', 'Aceptable', 'Adecuado', 'Muy adecuado'] },
      { texto: '3. ¿Qué tan clara le resultó la información proporcionada por el personal de la Ventanilla Virtual?',
        etiquetas: ['Muy poco clara', 'Poco clara', 'Aceptablemente clara', 'Clara', 'Muy clara'] },
      { texto: '4. ¿Qué tan probable es que recomiende la Ventanilla Virtual a otro usuario?',
        etiquetas: ['Muy poco probable', 'Poco probable', 'Algo probable', 'Probable', 'Muy probable'] },
      { texto: '5. ¿Qué tan satisfecho(a) se encuentra con el servicio recibido a través de la Ventanilla Virtual?',
        etiquetas: ['Muy insatisfecho(a)', 'Insatisfecho(a)', 'Ni satisfecho(a) ni insatisfecho(a)', 'Satisfecho(a)', 'Muy satisfecho(a)'] }
    ];
    const calif = [0, 0, 0, 0, 0];

    document.addEventListener('keydown', e => { if (e.key === 'Enter') solicitar(); });
    document.getElementById('inCedula').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 10);
    });

    function solicitar() {
      if (document.getElementById('login').style.display === 'none') return;

      const nombre = document.getElementById('inNombre').value.trim();
      const cedula = document.getElementById('inCedula').value.trim();
      const error = document.getElementById('error');
      error.textContent = '';

      if (!nombre) {
        error.textContent = 'Ingrese su nombre completo.';
        return;
      }
      if (!/^\d{10}$/.test(cedula)) {
        error.textContent = 'La cédula debe tener exactamente 10 números.';
        return;
      }

      document.getElementById('login').style.display = 'none';
      document.getElementById('espera').style.display = 'block';

      llamar('turno', { nombre: nombre, cedula: cedula })
        .then(r => {
          document.getElementById('espera').style.display = 'none';
          if (!r.ok) {
            document.getElementById('login').style.display = 'block';
            error.textContent = r.mensaje;
            return;
          }
          document.getElementById('nombre').textContent = r.nombre;
          document.getElementById('turno').textContent = r.turno;
          mostrarVideo(r.enlace);
          document.getElementById('resultado').style.display = 'block';
          miFecha = r.fecha;
          miTurno = r.turno;
          vigilarEstado();
        })
        .catch(err => {
          document.getElementById('espera').style.display = 'none';
          document.getElementById('login').style.display = 'block';
          error.textContent = 'Error: ' + err.message;
        });
    }

    function mostrarVideo(enlace) {
      document.querySelector('.card').classList.add('ancha');
      const marco = document.createElement('iframe');
      marco.src = enlace + '&config.prejoinConfig.enabled=false&config.prejoinPageEnabled=false&config.disableDeepLinking=true';
      marco.allow = 'camera; microphone; display-capture; autoplay; fullscreen; screen-wake-lock; clipboard-write';
      document.getElementById('videoBox').appendChild(marco);
    }

    function cerrarVideo() {
      document.getElementById('videoBox').innerHTML = '';
      const tarjeta = document.querySelector('.card');
      tarjeta.classList.remove('ancha');
      tarjeta.classList.remove('con-encuesta');
    }

    function vigilarEstado() {
      temporizador = setInterval(function () {
        llamar('estado', { fecha: miFecha, turno: miTurno })
          .then(function (r) {
            if (r && r.ok && r.estado === 'Asistido') {
              clearInterval(temporizador);
              document.querySelector('.card').classList.add('con-encuesta');
              document.getElementById('encuesta').style.display = 'block';
            }
          })
          .catch(function () {});
      }, 10000);
    }


    function construirEncuesta() {
      const molde = document.getElementById('moldePregunta');
      PREGUNTAS.forEach(function (preg, i) {
        const bloque = molde.cloneNode(true);
        bloque.removeAttribute('id');
        bloque.querySelector('.pregunta-titulo').textContent = preg.texto;
        const items = bloque.querySelectorAll('.tortuga-wrap');

        function pintar(n) {
          items.forEach(function (e) { e.classList.toggle('activa', Number(e.dataset.v) <= n); });
        }

        items.forEach(function (e) {
          const val = Number(e.dataset.v);
          const txt = document.createElement('span');
          txt.className = 'tortuga-txt';
          txt.innerHTML = '<b>' + val + '</b>' + preg.etiquetas[val - 1];
          e.appendChild(txt);

          e.addEventListener('mouseover', function () { pintar(val); });
          e.addEventListener('mouseout', function () { pintar(calif[i]); });
          e.addEventListener('click', function () {
            calif[i] = val;
            pintar(val);
            verificarHabilitarBoton();
          });
        });

        molde.parentNode.insertBefore(bloque, molde);
      });
      molde.remove();
    }
    construirEncuesta();
    
   function verificarHabilitarBoton() {
      if (calif.every(function (n) { return n > 0; })) {
        document.getElementById('btnEncuesta').disabled = false;
      }
    }

    function enviarEncuesta() {
      if (calif.some(function (n) { return !n; })) return;
      const btn = document.getElementById('btnEncuesta');
      const err = document.getElementById('errorEncuesta');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Enviando...';

    llamar('encuesta', { fecha: miFecha, turno: miTurno, p1: calif[0], p2: calif[1], p3: calif[2], p4: calif[3], p5: calif[4] })
        .then(function (r) {
          if (r && r.ok) {
            cerrarVideo();
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('encuesta').style.display = 'none';
            document.getElementById('gracias').style.display = 'block';
          } else {
            btn.disabled = false;
            btn.textContent = 'Enviar';
            err.textContent = (r && r.mensaje) || 'No se pudo enviar.';
          }
        })
        .catch(function (e) {
          btn.disabled = false;
          btn.textContent = 'Enviar';
          err.textContent = 'Error: ' + e.message;
        });
    }
  </script>
